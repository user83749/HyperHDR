name: HyperHDR (Amlogic)

# Builds this fork (HyperHDR 22.0.0 with the frame-delay change) into the
# add-on:  service.hyperhdr-22.0.0.zip  for 32-bit ARM Amlogic.
#
# Every push to amdelay-build refreshes the rolling "ci" pre-release.
# Pushing a v22.0.0* tag publishes a named release instead.
#
# The cross toolchain (~1.7 h to build) is kept two ways:
#   1. the Actions cache  - fast, but GitHub deletes it after 7 idle days
#   2. a tarball attached to the "build-cache" pre-release - never expires
# A run rebuilds the toolchain only when BOTH are gone (i.e. the build
# system itself changed). The weekly schedule keeps the Actions cache warm.

on:
  push:
    branches:
      - amdelay-build
    tags:
      - "v22.0.0*"
  schedule:
    - cron: "17 6 * * 1"   # Mondays - keep the toolchain cache from ageing out
  workflow_dispatch:
    inputs:
      buildroot_ref:
        description: "Build system branch"
        default: "coreelec-21"
      project:
        description: "PROJECT"
        default: "Amlogic-ce"
      device:
        description: "DEVICE"
        default: "Amlogic-ne"
      arch:
        description: "ARCH (arm = 32-bit)"
        default: "arm"

concurrency:
  group: hyperhdr-amlogic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      BUILDROOT_REF: ${{ github.event.inputs.buildroot_ref || 'coreelec-21' }}
      PROJECT: ${{ github.event.inputs.project || 'Amlogic-ce' }}
      DEVICE: ${{ github.event.inputs.device || 'Amlogic-ne' }}
      ARCH: ${{ github.event.inputs.arch || 'arm' }}
      HYPERHDR_REF: ${{ (github.event_name == 'schedule' && 'amdelay-build') || github.ref_name }}

    steps:
      - name: Maximise free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/az || true
          df -h /

      - name: Check out the Amlogic build system
        uses: actions/checkout@v4
        with:
          repository: CoreELEC/CoreELEC
          ref: ${{ env.BUILDROOT_REF }}
          path: buildroot

      - name: Check out HyperHDR
        uses: actions/checkout@v4
        with:
          path: HyperHDR
          fetch-depth: 0
          submodules: recursive

      - name: Apply the HyperHDR package recipe + buildroot patches
        working-directory: buildroot
        run: |
          set -eux
          dst=packages/addons/service/hyperhdr
          mkdir -p "$dst"
          cp ../HyperHDR/contrib/amlogic/package.mk "$dst/package.mk"
          sha="$(git -C ../HyperHDR rev-parse HEAD)"
          sed -i "s#^PKG_VERSION=.*#PKG_VERSION=\"${sha}\"#" "$dst/package.mk"
          # our commit lives on amdelay-build / a tag, not the fork's default branch
          {
            echo "PKG_GIT_CLONE_BRANCH=\"${HYPERHDR_REF}\""
            echo "PKG_GIT_CLONE_SINGLE=\"yes\""
          } >> "$dst/package.mk"
          # CE's source mirror 404s many GNU tarballs and gmplib.org / ftpmirror.gnu.org
          # are flaky from CI. Repoint every GNU-hosted source at ftp.gnu.org (complete + reliable).
          grep -rlE 'gmplib\.org|ftpmirror\.gnu\.org|ftp\.gnu\.org' packages/ 2>/dev/null | while read -r p; do
            sed -i \
              -e 's#https\?://gmplib\.org/download/gmp/#https://ftp.gnu.org/gnu/gmp/#g' \
              -e 's#https\?://ftpmirror\.gnu\.org/#https://ftp.gnu.org/gnu/#g' \
              -e 's#http://ftp\.gnu\.org/#https://ftp.gnu.org/#g' \
              "$p"
          done
          # buildroot's own cross-gcc is 13.2.0; CE21's glibc snapshot trips -Werror=return-type.
          # glibc adds -Werror after CFLAGS, so relax it at configure time.
          sed -i 's/--disable-timezone-tools"/--disable-timezone-tools --disable-werror"/' packages/devel/glibc/package.mk
          cat "$dst/package.mk"
          grep -n PKG_URL packages/devel/gmp/package.mk
          grep -n 'disable-werror' packages/devel/glibc/package.mk

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            buildroot/sources
            buildroot/.ccache
            buildroot/build.*/toolchain
            buildroot/build.*/.stamps
          key: amlogic-${{ env.DEVICE }}-${{ env.ARCH }}-${{ github.run_id }}
          restore-keys: |
            amlogic-${{ env.DEVICE }}-${{ env.ARCH }}-

      - name: Fetch prebuilt toolchain (durable fallback that never expires)
        id: tc
        working-directory: buildroot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          tcdir="$(ls -d build.*/toolchain 2>/dev/null | head -1 || true)"
          if [ -n "$tcdir" ] && ls "$tcdir"/bin/*gcc >/dev/null 2>&1; then
            echo "toolchain came back from the Actions cache"
            echo "have=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="toolchain-${BUILDROOT_REF}-${DEVICE}-${ARCH}.tar.zst"
          if gh release download build-cache -R "$GITHUB_REPOSITORY" \
               -p "${base}.part-*" -D /tmp 2>/dev/null && ls /tmp/${base}.part-* >/dev/null 2>&1; then
            cat /tmp/${base}.part-* | tar --use-compress-program=unzstd -xf -
            rm -f /tmp/${base}.part-*
            echo "toolchain restored from the build-cache release asset"
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "no prebuilt toolchain anywhere - this run builds it from scratch"
            echo "have=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the container image (CoreELEC's own, Ubuntu 22.04 / gcc-12)
        working-directory: buildroot
        run: docker build --pull -t ceb tools/docker/jammy

      - name: Build toolchain + HyperHDR add-on in the container
        working-directory: buildroot
        run: |
          set -eux
          # the image's build user is 'docker' (uid 1000); match ownership of the mount
          sudo chown -R 1000:1000 .
          docker run --rm -v "$PWD":/build -w /build \
            -e PROJECT="$PROJECT" -e DEVICE="$DEVICE" -e ARCH="$ARCH" \
            -e CCACHE_DIR=/build/.ccache \
            ceb bash -c 'set -e; ./scripts/build toolchain && ./scripts/create_addon hyperhdr'

      - name: Restore ownership
        if: always()
        working-directory: buildroot
        run: sudo chown -R "$(id -u):$(id -g)" . || true

      - name: Show build tree layout
        if: always()
        working-directory: buildroot
        run: du -sh build.*/* 2>/dev/null | sort -h | tail -20 || true

      - name: Publish prebuilt toolchain (durable fallback that never expires)
        if: success() && steps.tc.outputs.have == 'no'
        working-directory: buildroot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          base="toolchain-${BUILDROOT_REF}-${DEVICE}-${ARCH}.tar.zst"
          paths="$(ls -d sources build.*/toolchain build.*/.stamps 2>/dev/null)"
          tar --use-compress-program='zstd -19 -T0' -cf - $paths \
            | split -b 1900m - "/tmp/${base}.part-"
          ls -la /tmp/${base}.part-*
          gh release view build-cache -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create build-cache -R "$GITHUB_REPOSITORY" --prerelease \
                 --title "build cache" \
                 --notes "Prebuilt cross toolchain, refreshed automatically by CI. Keeping it costs nothing; deleting it just forces one slow rebuild."
          for a in $(gh release view build-cache -R "$GITHUB_REPOSITORY" --json assets \
                       -q '.assets[].name' | grep "^${base}.part-" || true); do
            gh release delete-asset build-cache "$a" -R "$GITHUB_REPOSITORY" -y || true
          done
          gh release upload build-cache -R "$GITHUB_REPOSITORY" /tmp/${base}.part-* --clobber

      - name: Save build cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            buildroot/sources
            buildroot/.ccache
            buildroot/build.*/toolchain
            buildroot/build.*/.stamps
          key: amlogic-${{ env.DEVICE }}-${{ env.ARCH }}-${{ github.run_id }}

      - name: Dump buildroot failure logs
        if: failure()
        working-directory: buildroot
        run: |
          d=$(ls -d build.*/.threads/logs 2>/dev/null | head -1)
          echo "logs dir: $d"
          [ -z "$d" ] && { echo "no logs dir"; exit 0; }
          for f in "$d"/*.log; do
            if grep -qiE "error:|cannot create executables|No such file|Can't locate|configure: error" "$f" 2>/dev/null; then
              echo "=== $f ==="; tail -n 150 "$f"; echo
            fi
          done

      - name: Collect the add-on zip
        working-directory: buildroot
        run: |
          set -eux
          mkdir -p ../out
          find . -type f -name 'service.hyperhdr-*.zip' -not -name '*-Amlogic*' -exec cp -v {} ../out/ \;
          ls -la ../out
          test -n "$(ls ../out/*.zip 2>/dev/null)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: service.hyperhdr
          path: out/*.zip
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'ci' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('HyperHDR {0}', github.ref_name) || 'HyperHDR 22.0.0 (latest build)' }}
          body: |
            HyperHDR 22.0.0 with an experimental smoothing frame-delay (`updateDelay`).
            `service.hyperhdr-22.0.0.zip` targets 32-bit ARM Amlogic.
            Built from `${{ github.sha }}`.
          files: out/*.zip
          draft: false
          prerelease: true
