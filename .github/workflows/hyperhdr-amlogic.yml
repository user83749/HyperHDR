name: HyperHDR (Amlogic)

# Builds this fork (HyperHDR 22.0.0 with the frame-delay change) into the
# add-on:  service.hyperhdr-22.0.0.zip  for 32-bit ARM Amlogic.
#
# Every push to amdelay-build refreshes the rolling "ci" pre-release.
# Pushing a v22.0.0* tag publishes a named release instead.
#
# First run compiles a cross toolchain + Qt6 (~1-3 h); later runs reuse
# the cached sources + ccache.

on:
  push:
    branches:
      - amdelay-build
    tags:
      - "v22.0.0*"
  workflow_dispatch:
    inputs:
      buildroot_ref:
        description: "Build system branch"
        default: "coreelec-21"
      project:
        description: "PROJECT"
        default: "Amlogic-ce"
      device:
        description: "DEVICE"
        default: "Amlogic-ne"
      arch:
        description: "ARCH (arm = 32-bit)"
        default: "arm"

concurrency:
  group: hyperhdr-amlogic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      BUILDROOT_REF: ${{ github.event.inputs.buildroot_ref || 'coreelec-21' }}
      PROJECT: ${{ github.event.inputs.project || 'Amlogic-ce' }}
      DEVICE: ${{ github.event.inputs.device || 'Amlogic-ne' }}
      ARCH: ${{ github.event.inputs.arch || 'arm' }}

    steps:
      - name: Maximise free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ make git wget curl xz-utils lzip lzop bc gperf zip unzip \
            xfonts-utils default-jre-headless python3 python-is-python3 \
            patchelf file rsync bsdmainutils cpio flex bison texinfo \
            libjson-perl libxml-parser-perl libxml-dumper-perl \
            libparse-yapp-perl rdfind xsltproc patchutils \
            libncurses-dev libssl-dev gawk

      - name: Check out the Amlogic build system
        uses: actions/checkout@v4
        with:
          repository: CoreELEC/CoreELEC
          ref: ${{ env.BUILDROOT_REF }}
          path: buildroot

      - name: Check out HyperHDR
        uses: actions/checkout@v4
        with:
          path: HyperHDR
          fetch-depth: 0
          submodules: recursive

      - name: Apply the HyperHDR package recipe
        run: |
          set -eux
          dst=buildroot/packages/addons/service/hyperhdr
          mkdir -p "$dst"
          cp HyperHDR/contrib/amlogic/package.mk "$dst/package.mk"
          sha="$(git -C HyperHDR rev-parse HEAD)"
          sed -i "s#^PKG_VERSION=.*#PKG_VERSION=\"${sha}\"#" "$dst/package.mk"
          echo "---- effective package.mk ----"; cat "$dst/package.mk"

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            buildroot/sources
            buildroot/.ccache
          key: amlogic-${{ env.DEVICE }}-${{ env.ARCH }}-${{ hashFiles('HyperHDR/contrib/amlogic/package.mk') }}
          restore-keys: |
            amlogic-${{ env.DEVICE }}-${{ env.ARCH }}-

      - name: Build the HyperHDR add-on
        working-directory: buildroot
        run: |
          set -eux
          export CCACHE_DIR="$PWD/.ccache"
          PROJECT="$PROJECT" DEVICE="$DEVICE" ARCH="$ARCH" \
            scripts/create_addon hyperhdr

      - name: Dump buildroot failure logs
        if: failure()
        run: |
          cd buildroot || exit 0
          d=$(ls -d build.*/.threads/logs 2>/dev/null | head -1)
          echo "logs dir: $d"
          [ -z "$d" ] && { echo "no logs dir"; exit 0; }
          for f in "$d"/*.log; do
            if grep -qiE "error:|cannot create executables|No such file|Can't locate|Error [0-9]+$|configure: error" "$f" 2>/dev/null; then
              echo "=================================================================="
              echo "=== $f"
              echo "=================================================================="
              tail -n 120 "$f"
              echo
            fi
          done

      - name: Collect the add-on zip
        run: |
          set -eux
          mkdir -p out
          # published name must be  service.hyperhdr-<version>.zip  -> keep it
          find buildroot -type f -name 'service.hyperhdr-*.zip' \
            -not -name '*-Amlogic*' -exec cp -v {} out/ \;
          ls -la out
          test -n "$(ls out/*.zip 2>/dev/null)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: service.hyperhdr
          path: out/*.zip
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'ci' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('HyperHDR {0}', github.ref_name) || 'HyperHDR 22.0.0 (latest build)' }}
          body: |
            HyperHDR 22.0.0 with an experimental smoothing frame-delay
            (`updateDelay`). `service.hyperhdr-22.0.0.zip` targets 32-bit ARM
            Amlogic.

            Built from `${{ github.sha }}`.
          files: out/*.zip
          draft: false
          prerelease: true
